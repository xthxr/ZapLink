name: Auto label issues and PRs

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-issues:
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply complexity and type labels
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            const getSectionValue = (heading) => {
              const regex = new RegExp(`###\\s+${heading}\\s*\\n+([^\\n]+)`, "i");
              const match = body.match(regex);
              if (!match) {
                return null;
              }

              const value = match[1].trim();
              if (!value || value.toLowerCase().includes("no response")) {
                return null;
              }

              return value;
            };

            const complexity = getSectionValue("Complexity");
            const type = getSectionValue("Type");
            const labels = [complexity, type].filter(Boolean);

            if (!labels.length) {
              core.info("No labels found in issue body.");
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels,
            });

  label-prs:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply mentor label
        uses: actions/github-script@v7
        with:
          script: |
            const label = "mentor:xthxr";

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
