name: Bug report
description: Report a bug to help us improve
title: "[Bug]: "
labels: []
body:
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      description: Choose the complexity level for this issue.
      options:
        - level:beginner
        - level:intermediate
        - level:advanced
        - level:critical
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Choose the issue type.
      options:
        - type:bug
        - type:feature
        - type:docs
        - type:testing
        - type:security
        - type:performance
        - type:design
        - type:refactor
        - type:devops
        - type:accessibility
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened and what did you expect?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll to '...'
        4. See error
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Add any screenshots or logs to help explain the problem.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, device, and version details.
      placeholder: |
        OS:
        Browser:
        Device:
        Version:
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other relevant context.
    validations:
      required: false
